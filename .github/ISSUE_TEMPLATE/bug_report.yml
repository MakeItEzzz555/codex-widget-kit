name: Bug report
description: Something is drawn wrong or not at all
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "codex --version, node --version, OS"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: frame
    attributes:
      label: Output of `codex-widgets --once`
      render: text
